<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>لوحة متابعة العمل التشغيلي</title>
<style>
:root{
  --bg:#f4f7fb;--surface:#fff;--line:#e5ebf3;--text:#12233b;--muted:#708197;
  --shadow:0 10px 28px rgba(16,24,40,.08);
  --blue:#2489ff;--orange:#ff981f;--gray:#9aa8ba;--yellow:#f5c044;--purple:#8256ff;
  --green:#159a68;--red:#f04466;--meeting:#2489ff;--study:#7b4ef6;--pink:#f05283;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--text);
  background:
    radial-gradient(circle at 100% 0%,rgba(36,137,255,.07),transparent 22%),
    radial-gradient(circle at 0% 100%,rgba(21,154,104,.06),transparent 24%),
    linear-gradient(180deg,#f8fafd,#eef4fb);
}
.layout{min-height:100vh;display:block}
.sidebar{
  width:230px;background:linear-gradient(180deg,#102944,#0d223b);color:#fff;padding:20px 14px;
  position:sticky;top:0;height:100vh;box-shadow:-4px 0 22px rgba(8,18,32,.14);
  transition:.25s;overflow:hidden
}
.layout.collapsed .sidebar{width:82px;padding-right:10px;padding-left:10px}
.sidebar-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#2b84ff,#8dccff);
  box-shadow:0 10px 18px rgba(43,132,255,.28);position:relative;flex:0 0 auto
}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;left:10px;right:10px;height:7px;border-radius:8px;background:#fff;transform:skewY(-18deg)}
.brand-mark:before{top:11px;box-shadow:0 12px 0 #fff}.brand-mark:after{display:none}
.brand-title{font-size:15px;font-weight:800;white-space:nowrap}
.brand-sub{font-size:10px;color:#a9bfd9;margin-top:3px;white-space:nowrap}
.collapse-btn{width:36px;height:36px;border-radius:11px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-size:18px;flex:0 0 auto}
.nav{display:flex;flex-direction:column;gap:9px}
.nav a{color:#d7e5f5;text-decoration:none;padding:13px 13px;border-radius:14px;display:flex;align-items:center;gap:11px;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.04)}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a.active{background:linear-gradient(90deg,rgba(36,137,255,.95),rgba(67,163,255,.58));box-shadow:0 10px 18px rgba(36,137,255,.22);color:#fff}
.nav .ico{width:18px;height:18px;border-radius:5px;border:2px solid currentColor;flex:0 0 auto}
.side-foot{position:absolute;bottom:18px;right:14px;left:14px;color:#90a7c3;font-size:11px;text-align:center;line-height:1.8}
.layout.collapsed .label,.layout.collapsed .brand-text,.layout.collapsed .side-foot{display:none}
.layout.collapsed .sidebar-top{justify-content:center}.layout.collapsed .nav a{justify-content:center;padding-right:0;padding-left:0}
.main{max-width:1500px;margin:0 auto;padding:20px 20px 30px}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
.header h1{margin:0;font-size:30px;color:#102a4b}
.toolbar{
  background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:260px 120px 120px 120px 1fr;gap:10px;align-items:center;padding:12px;margin-bottom:14px
}
.control,.btn{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 13px;font:inherit;color:#173150;font-size:13px;outline:none}
.btn{cursor:pointer;font-weight:800}.btn.primary{background:linear-gradient(180deg,#2180ff,#1a6ddf);color:#fff;border-color:#1e76ec;box-shadow:0 8px 16px rgba(33,128,255,.18)}
.btn.soft{background:linear-gradient(180deg,#fff,#f4f9ff)}
.actions{display:flex;gap:8px}
.status-row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.status{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-size:12px;color:#40556f}
.status .ok{width:9px;height:9px;border-radius:50%;background:#1db67a}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px;align-items:stretch}
.kpi{
  background:linear-gradient(180deg,#fff,#fbfdff);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;height:132px;min-height:132px
}
.kpi .meta{display:flex;flex-direction:column;gap:8px}.kpi .title{font-size:13px;font-weight:800;color:#203754}.kpi .value{font-size:32px;font-weight:900;color:#102a4b}
.kpi .icon{width:54px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900}
.kpi.days{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;height:132px;min-height:132px}
.day-ring{width:90px;height:90px;border-radius:50%;position:relative;background:conic-gradient(var(--pink) 0deg 130deg,#f5dfe7 130deg 360deg);flex:0 0 auto}
.day-ring:after{content:"";position:absolute;inset:14px;background:#fff;border-radius:50%;box-shadow:inset 0 0 0 1px #f2e7eb}
.day-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;color:#e94273;font-size:16px;font-weight:900;white-space:nowrap;letter-spacing:-.4px;padding:0 5px}
.day-info .big{font-size:23px;font-weight:900;color:#102a4b}.day-info .sub{font-size:11px;color:#6e7f94;margin-top:4px}.day-progress{height:9px;border-radius:999px;background:#e9edf4;overflow:hidden;margin-top:8px}.day-progress span{display:block;height:100%;background:linear-gradient(90deg,#f05283,#ff7aa3)}
.section-list{display:flex;flex-direction:column;gap:24px}
.section-row{
  display:grid;
  grid-template-columns:280px minmax(520px,1fr) 250px;
  gap:16px;
  align-items:stretch;
  min-height:220px;
  background:transparent;
  border:0;
  box-shadow:none;
  overflow:visible;
}
.section-summary,.section-chart,.section-dist{
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 12px 28px rgba(16,24,40,.08);
  overflow:hidden;
  min-height:220px;
}
.section-row.section-changes .section-summary,
.section-row.section-changes .section-chart,
.section-row.section-changes .section-dist{background:linear-gradient(135deg,#eef6ff 0%,#ffffff 78%)}
.section-row.section-issues .section-summary,
.section-row.section-issues .section-chart,
.section-row.section-issues .section-dist{background:linear-gradient(135deg,#eefaf5 0%,#ffffff 78%)}
.section-row.section-meetings .section-summary,
.section-row.section-meetings .section-chart,
.section-row.section-meetings .section-dist{background:linear-gradient(135deg,#fff6ed 0%,#ffffff 78%)}
.section-row.section-studies .section-summary,
.section-row.section-studies .section-chart,
.section-row.section-studies .section-dist{background:linear-gradient(135deg,#f7f1ff 0%,#ffffff 78%)}
.section-row.section-days .section-summary,
.section-row.section-days .section-chart,
.section-row.section-days .section-dist{background:linear-gradient(135deg,#fff4f8 0%,#ffffff 78%)}
.section-days .section-count{font-size:38px}
.section-days .dist-item{grid-template-columns:34px 1fr 64px}
.section-days .dist-val{white-space:nowrap}
.section-note{font-size:12px;color:var(--muted);margin-top:12px}
.section-summary{padding:18px;display:flex;flex-direction:column;justify-content:center;position:relative}
.section-summary:before{content:"";position:absolute;right:0;top:0;bottom:0;width:5px;background:var(--accent)}
.section-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px}
.section-title{font-size:23px;font-weight:900;color:#102a4b}.section-count{font-size:44px;font-weight:900;color:#102a4b;line-height:1;margin-top:8px}
.section-chart{padding:16px 18px}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.chart-title{font-size:14px;font-weight:800;color:#1c3556}.chart-sub{font-size:11px;color:#71849d}
.y-scale{display:flex;justify-content:space-between;color:#7b8fa7;font-size:10px;padding:0 2px}
.chart-area{
  min-height:170px;display:flex;align-items:flex-end;justify-content:space-around;gap:12px;
  border-right:2px solid #dbe5f0;border-bottom:2px solid #dbe5f0;padding:0 10px 0 6px;margin-top:8px;
  background:linear-gradient(to top,transparent 24%,rgba(95,122,164,.10) 24%,rgba(95,122,164,.10) 25%,transparent 25%,transparent 49%,rgba(95,122,164,.10) 49%,rgba(95,122,164,.10) 50%,transparent 50%,transparent 74%,rgba(95,122,164,.10) 74%,rgba(95,122,164,.10) 75%,transparent 75%)
}
.vbar{flex:1;max-width:82px;min-width:50px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px}.vbar-value{font-size:11px;font-weight:900;color:#1b3455}.vbar-col{width:100%;min-height:6px;border-radius:9px 9px 3px 3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 14px rgba(30,60,114,.08)}.vbar-label{font-size:11px;color:#223958;text-align:center;line-height:1.35}
.section-dist{padding:16px 14px}.dist-title{font-size:15px;font-weight:900;color:#173251;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(117,139,165,.18)}.dist-list{display:flex;flex-direction:column;gap:7px}
.dist-item{display:grid;grid-template-columns:34px 1fr 32px;gap:8px;align-items:center;padding:6px 7px;border-radius:10px;border:1px solid var(--line);background:#fff}
.logo{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900}.dist-name{font-size:11px;color:#314864}.dist-val{font-size:12px;font-weight:900;text-align:left}
.table-card{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px}
.table-tools{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.search{width:340px;max-width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 13px;font:inherit;outline:none}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;font-size:12px}thead th{position:sticky;top:0;background:#f8fbff;color:#425770;text-align:right;padding:11px 12px;border-bottom:1px solid var(--line)}tbody td{padding:11px 12px;border-bottom:1px solid #eef2f6;vertical-align:top}tbody tr:hover{background:#fbfdff}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800}.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.muted{color:#97a5b4}.hidden{display:none}
@media(max-width:1280px){.kpis{grid-template-columns:repeat(2,1fr)}.section-row{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}}
@media(max-width:980px){.layout{display:block}.sidebar{display:none}}
@media(max-width:720px){.main{padding:12px}.kpis{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.header h1{font-size:23px}}

.kpi .icon svg{width:28px;height:28px;display:block}
.section-icon svg{width:27px;height:27px;display:block}
.logo svg{width:17px;height:17px;display:block}
.kpi .icon,.section-icon,.logo{line-height:0}

<body>
<div class="layout" id="layout">
  <main class="main" id="top">
    <section class="header"><div><h1 id="pageTitle">لوحة متابعة العمل التشغيلي</h1></div></section>

    <section class="toolbar">
      <select id="tagFilter" class="control"><option value="">جميع الأنظمة</option></select>
      <button id="resetBtn" class="btn soft">إعادة ضبط</button>
      <button id="refreshBtn" class="btn primary">تحديث</button>
      <button id="exportBtn" class="btn soft">تصدير HTML</button>
      <button id="pdfBtn" class="btn soft" title="افتح نافذة الطباعة واختر حفظ بصيغة PDF">تصدير PDF</button>
      <div class="actions">
        <input id="csvFile" type="file" accept=".csv" class="hidden">
        <label for="csvFile" id="uploadBtn" class="btn soft" style="display:flex;align-items:center;justify-content:center">رفع CSV</label>
      </div>
    </section>

    <section class="status-row">

x=\"3\" stroke=\"currentColor\" stroke-width=\"1.8\"/><path d=\"M8 9h8M8 13h8M8 17h5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/></svg>", "المشتريات": "<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"3\" stroke=\"currentColor\" stroke-width=\"1.8\"/><path d=\"M8 9h8M8 13h8M8 17h5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/></svg>", "المالية": "<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"3\" stroke=\"currentColor\" stroke-width=\"1.8\"/><path d=\"M8 9h8M8 13h8M8 17h5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/></svg>", "اجتماع دوري": "<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3\" stroke=\"currentColor\" stroke-width=\"1.8\"/><circle cx=\"17\" cy=\"9\" r=\"2.4\" stroke=\"currentColor\" stroke-width=\"1.8\"/><path d=\"M3.5 19c.4-4 2.5-6 5.5-6s5.1 2 5.5 6M14.5 14c3.3-.5 5.4 1.2 6 4.5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/></svg>"};

const fmt=n=>new Intl.NumberFormat("en-US",{maximumFractionDigits:2}).format(Number(n||0));

function grouped(rows,mode="count"){const obj={};rows.forEach(r=>{const k=r.tag||"غير محدد";const add=mode==="cost"?Number(r.cost||0):1;obj[k]=(obj[k]||0)+add});return Object.entries(obj).sort((a,b)=>b[1]-a[1])}
function shadeColor(color,percent){const num=parseInt(color.slice(1),16),amt=Math.round(2.55*percent),R=(num>>16)+amt,G=(num>>8&255)+amt,B=(num&255)+amt;return"#"+(0x1000000+(R<255?(R<1?0:R):255)*0x10000+(G<255?(G<1?0:G):255)*0x100+(B<255?(B<1?0:B):255)).toString(16).slice(1)}
function fillFilter(rows){const cur=$("tagFilter").value;const tags=[...new Set(rows.map(r=>r.tag).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar"));$("tagFilter").innerHTML='<option value="">جميع الأنظمة</option>'+tags.map(t=>`<option value="${t}">${t}</option>`).join("");if(tags.includes(cur))$("tagFilter").value=cur}
function currentRows(){const tag=$("tagFilter").value;return ALL_ROWS.filter(r=>!tag||r.tag===tag)}

function buildSections(){
 const host=$("sectionsHost");host.innerHTML="";
 SECTION_CONFIG.forEach(sec=>{
   const s=document.createElement("section");s.className="section-row section-"+sec.key;s.id=sec.anchor;s.style.setProperty("--accent",sec.color);
   s.innerHTML=`

      ${sec.mode==="cost"?'<div class="section-note">إجمالي أيام طلبات التغيير</div>':""}
    </div>
    <div class="section-chart">
      <div class="chart-head"><div class="chart-title">${sec.title} حسب الأنظمة</div></div>
      <div class="chart-area" id="bars-${sec.key}" role="list" aria-label="${sec.title} حسب الأنظمة"></div>
    </div>
    <div class="section-dist">
      <div class="dist-title">${sec.mode==="cost"?"توزيع الأيام على الأنظمة":"التوزيع حسب الأنظمة"}</div>
      <div class="dist-list" id="dist-${sec.key}"></div>
    </div>`;
   host.appendChild(s);
 });
}

function renderBars(key,rows){
 const host=$("bars-"+key);host.replaceChildren();
 const sec=SECTION_CONFIG.find(section=>section.key===key);
 if(!rows.length){const empty=document.createElement("div");empty.className="chart-empty";empty.textContent="لا توجد بيانات";host.appendChild(empty);return}
 const max=Math.max(...rows.map(row=>Number(row[1])),0);
 rows.forEach(([name,value],index)=>{
  const row=document.createElement("div");row.className="hrow";row.setAttribute("role","listitem");
  const label=document.createElement("div");label.className="hlabel";label.textContent=name;
  const track=document.createElement("div");track.className="htrack";track.setAttribute("aria-hidden","true");
  const bar=document.createElement("div");bar.className="hfill";bar.style.width=(max>0?Math.max(0,value)/max*100:0)+"%";bar.style.background=sec.color;bar.style.opacity=Math.max(.38,1-index*.12);track.appendChild(bar);
  const number=document.createElement("div");number.className="hvalue";number.textContent=fmt(value)+(sec.mode==="cost"?" يوم":"");
  row.append(label,track,number);host.appendChild(row);
 });
}
function renderDist(key,rows){
 const host=$("dist-"+key);host.innerHTML="";
 rows.forEach(([name,val])=>{const d=document.createElement("div");d.className="dist-item";d.innerHTML=`<div class="logo" style="background:${SYSTEM_BG[name]||"#f4f7fb"};color:${SYSTEM_COLORS[name]||"#2489ff"}">${SYSTEM_LOGO[name]||"•"}</div><div class="dist-name">${name}</div><div class="dist-val">${fmt(val)}</div>`;host.appendChild(d)});
 if(!rows.length)host.innerHTML='<div class="muted">لا توجد بيانات</div>'
}
function renderSection(sec){
 const data=CURRENT_ROWS.filter(r=>r.type===sec.type);
 const isDays=sec.mode==="cost";
 const dist=grouped(data,sec.mode).filter(([,value])=>!isDays||value!==0);
 const total=isDays?dist.reduce((sum,row)=>sum+row[1],0):data.length;
 $("total-"+sec.key).textContent=fmt(total)+(isDays?" يوم":"");
 renderBars(sec.key,dist);renderDist(sec.key,dist);
 if(isDays)$("dist-"+sec.key).querySelectorAll(".dist-val").forEach(el=>el.textContent+=" يوم");
}
function renderKpis(){
 const changes=CURRENT_ROWS.filter(r=>r.type==="طلبات التغيير");
 const issues=CURRENT_ROWS.filter(r=>r.type==="مشكلة");
 const meetings=CURRENT_ROWS.filter(r=>r.type==="اجتماع");
 const studies=CURRENT_ROWS.filter(r=>r.type==="دراسة فنية");
 $("kChange").textContent=fmt(changes.length);$("kIssue").textContent=fmt(issues.length);$("kMeeting").textContent=fmt(meetings.length);$("kStudy").textContent=fmt(studies.length);
 const used=changes.reduce((a,b)=>a+Number(b.cost||0),0),pct=Math.min((used/TOTAL_DAYS)*100,100),deg=(pct/100)*360,remain=Math.max(TOTAL_DAYS-used,0);
 $("kDays").textContent=fmt(used);$("kDayPct").textContent=fmt(pct)+"%";$("kRemain").textContent=fmt(remain);$("kDayBar").style.width=pct+"%";$("kDayRing").style.background=`conic-gradient(var(--pink) 0deg ${deg}deg,#f5dfe7 ${deg}deg 360deg)`
}
function renderTable(rows){
 const q=$("searchBox").value.trim().toLowerCase();const filtered=rows.filter(r=>{const hay=`${r.title||""} ${r.tag||""} ${r.type||""} ${r.state||""}`.toLowerCase();return!q||hay.includes(q)});
 $("tableCount").textContent=fmt(filtered.length)+" سجل";$("tbody").innerHTML=filtered.map(r=>{const st=TYPE_BADGES[r.type]||{bg:"#eef2f7",color:"#5d6f83"};return`<tr><td>${r.id??"—"}</td><td><span class="badge" style="background:${st.bg};color:${st.color}">${r.type||"—"}</span></td><td>${r.title||"—"}</td><td>${r.state||"—"}</td><td>${r.tag||"—"}</td><td>${fmtDate(r.doneDate)}</td><td>${r.cost?fmt(r.cost):'<span class="muted">—</span>'}</td></tr>`}).join("")

function update(){CURRENT_ROWS=currentRows();renderKpis();SECTION_CONFIG.forEach(renderSection);renderTable(CURRENT_ROWS)}

function currentRows(){const tag=$("tagFilter").value;return ALL_ROWS.filter(r=>!tag||r.tag===tag)}

function exportPdf(){
 const heading=$("pageTitle");
 const originalHeading=heading.textContent;
 const title=prompt("اكتب عنوان لوحة المتابعة المصدّرة:",originalHeading);
 if(title===null)return;
 const originalTitle=document.title;
 const exportTitle=title.trim()||originalHeading;
 const restoreTitle=()=>{
  heading.textContent=originalHeading;
  document.title=originalTitle;
  window.removeEventListener("afterprint",restoreTitle);
 };
 const tag=$("tagFilter").value||"جميع الأنظمة";
 const search=$("searchBox").value.trim();
 $("printContext").textContent="النظام: "+tag+(search?" • بحث تفاصيل الأعمال: "+search:"");
 heading.textContent=exportTitle;
 document.title=exportTitle;
 window.addEventListener("afterprint",restoreTitle,{once:true});
 try{window.print()}catch(error){restoreTitle();throw error}
}
function exportHtml(){const t=prompt("اكتب عنوان لوحة المتابعة المصدّرة:",$("pageTitle").textContent)||$("pageTitle").textContent;const html=standaloneHtml(t.trim()||$("pageTitle").textContent);const blob=new Blob([html],{type:"text/html;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="dashboard_export.html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}

$("tagFilter").addEventListener("change",update);
$("refreshBtn").addEventListener("click",()=>loadData(true));
$("resetBtn").addEventListener("click",()=>{$("tagFilter").value="";$("searchBox").value="";update()});
$("searchBox").addEventListener("input",()=>renderTable(CURRENT_ROWS));
$("exportBtn").addEventListener("click",exportHtml);
$("pdfBtn").addEventListener("click",exportPdf);

$("csvFile").addEventListener("change",async()=>{
 const file=$("csvFile").files[0];if(!file)return;$("dataStatus").textContent=`جارٍ رفع ${file.name}...`;const old=$("uploadBtn").textContent;$("uploadBtn").textContent="جارٍ الرفع...";$("uploadBtn").style.pointerEvents="none";
 try{const form=new FormData();form.append("csv",file);const res=await fetch("/api/upload-csv",{method:"POST",body:form});const p=await res.json();if(!res.ok)throw new Error(p.details||p.error||"فشل رفع الملف");$("dataStatus").textContent=`تم رفع الملف بنجاح - ${fmt(p.count)} سجل`;await loadData(false)}
 catch(e){console.error(e);$("dataStatus").textContent="فشل رفع CSV";alert("تعذر تحديث البيانات:\n"+e.message)}
 finally{$("csvFile").value="";$("uploadBtn").textContent=old;$("uploadBtn").style.pointerEvents="auto"}
});
function live(){const es=new EventSource("/events");es.addEventListener("data-changed",async()=>{$("dataStatus").textContent="تم اكتشاف تحديث للبيانات - جارٍ إعادة التحميل...";await loadData(false)});es.onerror=()=>console.warn("reconnecting...")}
buildSections();loadData(true);live();setInterval(()=>loadData(false),120000);
</script>
